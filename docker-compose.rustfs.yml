# S3-compatible local object storage (Apache-2.0). Use instead of docker-compose.minio.yml.
# Presigned URLs need the same hostname in the browser and in Docker:
#   127.0.0.1 rustfs
# Label Studio S3: endpoint http://rustfs:9000  key/secret labelstudio  bucket labelstudio
x-logging:
  logging: &default-logging
    driver: "local"
    options:
      max-size: "10m"
      max-file: "3"

services:
  rustfs:
    image: "rustfs/rustfs:${RUSTFS_VERSION:-latest}"
    command: /data
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-labelstudio}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-labelstudio}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_REGION=us-east-1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  rustfs-data:
